[training]
# Number of PPO training iterations to run.
iterations = 200

# Directory to save checkpoints during and after training.
checkpoint_dir = "checkpoints/"

# Save a checkpoint every N iterations (0 = only at the end).
checkpoint_freq = 10

# Environment overrides for training (shorter episodes = faster iterations).
max_steps = 1000

[viewer]
# Path to the RLlib checkpoint directory used by rllib_band_eval.py.
checkpoint_dir = "checkpoints/"

# Pixel size of each grid cell before scale is applied.
cell_size = 18

# Sidebar width before scale is applied.
sidebar_width = 440

# UI scale multiplier for the whole pygame window.
scale = 1.7

# Render frames per second.
fps = 12

# Reset seed used by the viewer.
seed = 123

# Milliseconds between automatic random-policy steps.
auto_step_delay_ms = 180

[environment]
# Local grid side length. Must be odd.
grid_size = 31

# Square local observation size around each agent. Must be odd.
obs_range = 11

# Episode cutoff in steps.
max_steps = 5000

# Number of bands placed in the patch.
num_bands = 1

# Number of living members in each band at reset.
members_per_band = 15

# Maximum member slots per band, including inactive reserve slots for births.
max_members_per_band = 30

# Starting body energy for each member.
initial_energy = 100.0

# Upper cap for member body energy.
max_energy = 150.0

# Starting body water for each member.
initial_hydration = 100.0

# Upper cap for member body water.
max_hydration = 100.0

# Body water lost by each living member every step.
thirst_per_step = 0.2

# Body water restored automatically when a member enters a water cell.
drink_amount = 5.0

# Use kcal/kg/km movement costs and body-mass-scaled internal energy stores.
use_physical_energetics = true
adult_body_mass_kg = 70.0
newborn_body_mass_kg = 14.0
initial_energy_per_kg = 22.0
max_energy_per_kg = 35.0
newborn_energy_per_kg = 30.0
cell_distance_km = 0.25
walking_kcal_per_kg_km = 1.0
food_energy_density_kcal_per_kg = 2500.0
water_liters_per_unit = 1.0

# Global multiplier applied to movement costs.
movement_cost = 1.0

# Cost multiplier for moving onto grass.
grass_movement_cost = 1.0

# Cost multiplier for moving onto water.
water_movement_cost = 1.5

# Fraction of moved internal and carried resource energy spent per move before
# terrain and seasonal multipliers.
movement_energy_rate = 0.01

# Relative movement load of one carried water unit.
water_load_factor = 1.0

# Maximum direct energy stored in a full plant cell, in kcal.
plant_energy_capacity = 1000.0

# Maximum direct plant energy transferred automatically when a member enters a
# plant cell, in kcal.
plant_eat_amount = 400.0

# Share of harvested plant energy reserved for carrying to camp when the member
# has food carry capacity.
plant_carry_share = 0.5

# Maximum grass energy available to animals in a grassland cell.
grass_energy_capacity = 1000.0

# Grass energy restored each step on grassland cells, before seasonal scaling.
grass_regrowth_base = 10.0

# Maximum animal food energy in a rich animal cell, in kcal.
animal_energy_capacity = 2500.0

# Number of animal agents placed at reset.
initial_animals = 35

# Maximum number of living animal agents in a patch.
max_animals = 120

# Starting animal body energy, in kcal.
initial_animal_energy = 1200.0

# Maximum animal body energy, in kcal.
max_animal_energy = 2500.0

# Energy paid when an animal moves one cell.
animal_move_cost = 8.0

# Plant energy an animal can eat from its cell per step.
animal_eat_amount = 120.0

# Animal can reproduce asexually at or above this energy.
animal_reproduction_energy_threshold = 2000.0

# Energy removed from parent on reproduction.
animal_reproduction_cost = 900.0

# Starting energy assigned to newborn animals.
newborn_animal_energy = 800.0

# Maximum animal energy harvested when a member enters an animal cell, in kcal.
animal_hunt_amount = 800.0

# Share of hunted animal energy reserved for carrying to camp.
animal_carry_share = 1.0

# Maximum external food energy a member can carry back to camp, in kcal.
food_carry_capacity = 3000.0

# Maximum external water liters a member can carry back to camp.
water_carry_capacity = 25.0

# Water liters collected for carrying when a member enters water.
water_collect_amount = 8.0

# Members eat harvested plants directly only until this internal reserve.
personal_energy_reserve = 2100.0

# Camp storage feeds members at camp below this body energy.
camp_food_withdraw_threshold = 1800.0

# Maximum food energy a member can take from camp storage per step, in kcal.
camp_food_withdraw_amount = 400.0

# Camp storage hydrates members at camp below this hydration level.
camp_water_withdraw_threshold = 60.0

# Maximum water units a member can take from camp storage per step.
camp_water_withdraw_amount = 5.0

# Manhattan distance from camp where members can deposit and withdraw storage.
camp_storage_radius = 11

# Maximum food energy that can be stored at camp, in kcal. 0 = no cap.
camp_max_stored_food = 20000.0

# Maximum water liters that can be stored at camp. 0 = no cap.
camp_max_stored_water = 200.0

# Fraction of stored food lost each step to spoilage. 0 = no decay.
camp_food_decay_rate = 0.005

# Width in cells of the ford cut through the river. 0 = no crossing.
river_crossing_width = 3

# Plant energy added each step to plant cells, before seasonal scaling.
plant_regrowth_base = 0.08

# Number of steps per season.
season_length = 12

# Manhattan radius around the camp used to measure nearby plant depletion.
# Automatic relocation excludes candidate camps whose radius overlaps the old
# camp radius.
camp_depletion_radius = 11

# Camp relocates automatically when nearby plant depletion reaches this value.
camp_depletion_threshold = 0.75

# Maximum Manhattan distance from camp to the nearest water cell. Camp also
# relocates when this is exceeded. 0 = no water-proximity constraint.
camp_max_water_distance = 8

# Optional energy cost paid by each living band member when camp relocates.
camp_relocation_cost = 0.0

# Band-level asexual reproduction.
reproduction_enabled = true
reproduction_adult_age = 750
max_age = 3000
mortality_onset_years = 25.0
mortality_rate_per_year = 0.05
reproduction_energy_threshold = 0.95
reproduction_cooldown_steps = 50
birth_rate = 0.01
birth_food_cost = 2000.0
newborn_hydration = 80.0

# Reward shaping for trainable cooperative behavior.
plant_food_reward = 0.05
animal_food_reward = 0.10
food_deposit_reward = 0.03
water_collect_reward = 0.10
water_deposit_reward = 0.30
birth_reward = 2.0
population_reward = 0.001
juvenile_survival_reward = 0.002

# Base seed for deterministic patch generation.
global_seed = 12345

[season]
# Season order: spring, summer, autumn, winter.
# Multiplies initial plant energy and plant regrowth.
plant_mod = [1.35, 1.15, 0.75, 0.15]

# Multiplies movement costs.
cost_mod = [1.05, 0.9, 1.05, 1.35]

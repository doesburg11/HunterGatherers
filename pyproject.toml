[project]
name = "hunter-gatherers"
version = "0.1.0"
description = "Patch-based hunter-gatherer reinforcement learning environments."
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
viewer = [
    "pygame>=2.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hunter_gatherers*"]
